<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Packages - Client Portal</title>
    <!-- Combined global and client specific styling -->
    <link rel="stylesheet" href="../../styles/vendor_css/global.css">
    <link rel="stylesheet" href="../../styles/vendor_css/vendor.css"> 
    <link rel="stylesheet" href="../../styles/client_css/client.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <div class="brand-icon"><i class="ph-fill ph-calendar-blank"></i></div>
                <div>
                    <div class="brand-name">EventPro</div>
                    <div class="brand-role">Client Portal</div>
                </div>
            </div>
            <nav class="sidebar__nav">
                <a href="client-dashboard.html" class="nav-item"><i class="ph ph-squares-four"></i> Dashboard</a>
                <a href="create_event_client.html" class="nav-item"><i class="ph ph-plus"></i> Create Event</a>
                <a href="client_myevents.html" class="nav-item"><i class="ph ph-list-bullets"></i> My Events</a>
                <a href="client_browsepackages.html" class="nav-item active"><i class="ph ph-tote"></i> Browse Packages</a>
                <a href="client_coordination.html" class="nav-item"><i class="ph ph-chat-teardrop-dots"></i> Messages</a>
                <a href="client_billing.html" class="nav-item"><i class="ph ph-credit-card"></i> Billing</a>
                <a href="client_reportissue.html" class="nav-item"><i class="ph ph-warning-circle"></i> Report Issue</a>
            </nav>
            <div class="sidebar__footer">
                <div class="user-info">
                    <div class="user-avatar">J</div>
                    <div>
                        <div class="user-name">John</div>
                        <div class="user-email">john@gmail.com</div>
                    </div>
                </div>
                <a href="../LandingPage/index.html" class="logout-btn"><i class="ph ph-sign-out"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Topbar -->
            <div class="topbar">
                <div>
                    <div class="page-title">Browse Event Packages</div>
                    <div style="font-size:13px; color:var(--text-secondary); margin-top:2px;">Select from our curated event packages</div>
                </div>
            </div>

            <div class="content">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
                    <div class="filter-tabs" style="margin-bottom:0;">
                        <button class="filter-btn active" data-category="all">All</button>
                        <button class="filter-btn" data-category="wedding">Wedding</button>
                        <button class="filter-btn" data-category="birthday">Birthday</button>
                        <button class="filter-btn" data-category="conference">Conference</button>
                        <button class="filter-btn" data-category="corporate">Corporate</button>
                        <button class="filter-btn" data-category="party">Party</button>
                    </div>
                    <div class="search-box" style="width:280px; background:var(--bg-card);">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" id="searchPackages" placeholder="Search packages or services...">
                    </div>
                </div>

                <div class="packages-grid" id="packagesGrid">
                    <!-- Cards will be populated dynamically from vendor packages in list -->
                </div>
            </div>
        </main>
        
        <!-- Quick Create Modal -->
        <div class="modal-overlay" id="quickCreateModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
            <div class="modal" style="width:min(500px, 92vw); background:var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow:hidden;">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);">
                    <h3 style="font-size:16px;font-weight:700;"><i class="ph ph-lightning" style="color:var(--pink);"></i> Quick Create: <span id="qcPackageName">Package</span></h3>
                    <button id="qcClose" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;">✕</button>
                </div>
                <div style="padding:24px;display:flex;flex-direction:column;gap:16px;">
                    <div class="form-group">
                        <label>Event Name *</label>
                        <input type="text" id="qcEventName" class="form-control" placeholder="E.g., Yearly Summit" required>
                    </div>
                    <div style="display:flex;gap:16px;">
                        <div class="form-group" style="flex:1;">
                            <label>Event Date *</label>
                            <input type="date" id="qcEventDate" class="form-control" required>
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label>Event Time</label>
                            <input type="time" id="qcEventTime" class="form-control" value="09:00">
                        </div>
                    </div>
                    <div style="display:flex;gap:16px;">
                        <div class="form-group" style="flex:2;">
                            <label>Venue Location</label>
                            <input type="text" id="qcVenue" class="form-control" placeholder="E.g., Central Hall">
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label>Guests</label>
                            <input type="number" id="qcPeople" class="form-control" placeholder="100">
                        </div>
                    </div>
                    <input type="hidden" id="qcPackageId">
                </div>
                <div style="padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;">
                    <button id="qcCancel" class="btn btn-ghost">Cancel</button>
                    <button id="qcSubmit" class="btn btn-primary"><i class="ph ph-check-circle"></i> Create Request</button>
                </div>
            </div>
        </div>
        
    </div>
    <script src="../../scripts/vendor_js/data.js"></script>
    <script src="../../scripts/client_js/client_browsepackages.js"></script>
    <script src="../../scripts/client_js/client_utils.js"></script>


    <!-- Global Injections -->
    <script src="../../scripts/profile-modal.js"></script>
    <script src="../../scripts/welcome-overlay.js"></script>
</body>
</html>
