<style>
    /* ══════════════════════
       REPORT ISSUE PAGE
    ══════════════════════ */
    .ri-wrapper {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 10px 0 30px;
    }

    .ri-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 680px;
      overflow: hidden;
    }

    /* Header strip */
    .ri-card__header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 28px;
      border-bottom: 1px solid var(--border);
    }

    .ri-header-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(233,30,140,0.12);
      border: 1px solid rgba(233,30,140,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pink);
      flex-shrink: 0;
    }

    .ri-header-text h3 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .ri-header-text p {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    /* Form body */
    .ri-body {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .ri-form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .ri-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .ri-input,
    .ri-textarea,
    .ri-select {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 13.5px;
      outline: none;
      width: 100%;
      transition: border-color 0.18s;
    }
    .ri-input:focus,
    .ri-textarea:focus,
    .ri-select:focus { border-color: rgba(233,30,140,0.5); }
    .ri-input::placeholder,
    .ri-textarea::placeholder { color: var(--text-muted); }
    .ri-textarea { min-height: 110px; resize: vertical; }

    /* Custom select wrapper */
    .ri-select-wrap {
      position: relative;
    }
    .ri-select {
      appearance: none;
      cursor: pointer;
      padding-right: 36px;
    }
    .ri-select option { background: #2e1c40; }
    .ri-select-wrap i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
      width: 14px;
      height: 14px;
    }

    /* Two-col row */
    .ri-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 560px) { .ri-row { grid-template-columns: 1fr; } }

    /* Reporter info box */
    .ri-reporter {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ri-reporter__title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .ri-reporter__row {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
    }

    .ri-reporter__field {
      font-size: 13px;
      color: var(--text-muted);
    }
    .ri-reporter__field span {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Footer buttons */
    .ri-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 28px 28px;
    }

    .ri-submit {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--pink);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--pink-glow);
      transition: background 0.18s;
    }
    .ri-submit:hover { background: var(--pink-light); }

    .ri-cancel {
      padding: 12px 22px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }
    .ri-cancel:hover { border-color: var(--border-hover); color: var(--text-primary); }

    /* Success toast */
    .ri-toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #15803d;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
    }
    .ri-toast.show { transform: translateY(0); opacity: 1; }
  </style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
      // Setup reporter info
      var session = null;
      try {
        session = JSON.parse(sessionStorage.getItem('checkmate_session') || localStorage.getItem('checkmate_session') || 'null');
      } catch(e) {}
      
      // session.user may be an object or string
      var reporterName = 'Vendor User';
      var reporterRole = 'Staff';
      var reporterEmail = 'staff@example.com';
      if (session) {
        if (typeof session.user === 'string') reporterName = session.user;
        else if (session.user && session.user.name) reporterName = session.user.name;
        else if (session.name) reporterName = session.name;
        reporterRole = session.role || 'Staff';
        reporterEmail = session.email || (session.user && session.user.email) || 'vendor@example.com';
      }
      
      var reporterRows = document.querySelectorAll('.ri-reporter__field span');
      if (reporterRows.length >= 3) {
        reporterRows[0].textContent = reporterName;
        reporterRows[1].textContent = reporterRole;
        reporterRows[2].textContent = reporterEmail;
      }
      
      var submitBtn = document.getElementById('submitBtn');
      submitBtn.addEventListener('click', function() {
        var title = document.querySelector('.ri-input').value.trim();
        var desc = document.querySelector('.ri-textarea').value.trim();
        var selects = document.querySelectorAll('.ri-select');
        var priority = selects[0].value;
        var category = selects[1].value;
        
        if (!title || !desc || !priority || !category) {
          alert('Please fill out all fields.');
          return;
        }
        
        // Submit to admin via DB issues collection
        DB.add('issues', {
          id: 'tkt_' + Date.now(),
          target: 'admin',
          title: title,
          description: desc,
          priority: priority,
          category: category,
          status: 'Open',
          reporter: reporterName,
          role: reporterRole,
          email: reporterEmail,
          createdAt: new Date().toISOString()
        });
        
        // Auto-post system message to admin coordination chat
        var chatMsgs = DB.get('adminChatMessages') || [];
        chatMsgs.push({
          id: 'msg_' + Date.now(),
          sender: reporterName,
          senderRole: reporterRole,
          senderEmail: reporterEmail,
          text: '\ud83d\udccb Issue Reported: ' + title + ' | Priority: ' + priority + ' | Category: ' + category,
          timestamp: new Date().toISOString(),
          type: 'issue-report'
        });
        DB.set('adminChatMessages', chatMsgs);
        
        var toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 3000);
        
        document.querySelector('.ri-input').value = '';
        document.querySelector('.ri-textarea').value = '';
        selects[0].value = '';
        selects[1].value = '';
      });
      
      var cancelBtn = document.querySelector('.ri-cancel');
      cancelBtn.addEventListener('click', function() {
        document.querySelector('.ri-input').value = '';
        document.querySelector('.ri-textarea').value = '';
        selects[0].value = '';
        selects[1].value = '';
      });
    });
  </script>
