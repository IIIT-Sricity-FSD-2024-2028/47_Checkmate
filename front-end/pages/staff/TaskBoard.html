<style>
/* ── Theme & Layout Overrides ── */
.kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; min-height: 500px; }
.kanban-col { background: rgba(255,255,255,0.03); border: 1px solid var(--border2); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--border2); }
.col-title { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text); font-size: 14px; }
.col-count { background: var(--bg3); padding: 2px 8px; border-radius: 10px; font-size: 11px; color: var(--text2); }

/* ── Task Card ── */
.task-card { background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; padding: 14px; cursor: grab; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
.task-card:active { cursor: grabbing; }
.task-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-color: rgba(233,30,140,0.3); }
.task-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.task-name { font-size: 14px; font-weight: 600; color: var(--text); }
.task-event { font-size: 11px; color: var(--pink); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
.task-desc { font-size: 12.5px; color: var(--text2); line-height: 1.5; margin-bottom: 12px; }
.task-meta { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border2); padding-top: 10px; margin-top: 4px; }
.task-meta-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text3); }
.priority-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 800; }

.drag-over { background: rgba(233,30,140,0.05) !important; border-color: var(--pink) !important; border-style: dashed !important; }

/* ── Add Task Button ── */
.add-task-btn { width: 100%; padding: 10px; background: transparent; border: 1px dashed var(--border2); border-radius: 8px; color: var(--text3); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.add-task-btn:hover { border-color: var(--pink); color: var(--pink); background: rgba(233,30,140,0.05); }

/* ── Modal ── */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
.modal-content { background: var(--bg-card); width: min(400px, 90vw); border-radius: 16px; border: 1px solid var(--border); padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.modal-header { margin-bottom: 20px; }
.modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); outline: none; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.btn-primary { background: var(--pink); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }

#taskBoardHeader { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
</style>
</head>

<!-- MAIN -->
<main class="main"><div class="content"><div id="taskBoardHeader">
    <div>
      <div class="page-title">Task Board</div>
      <div class="page-sub">Drag and drop tasks across columns to update their status</div>
    </div>
    <div style="display:flex; gap:10px;">
    </div>
  </div><div class="kanban">
    <!-- TODO -->
    <div class="kanban-col" id="col_todo" ondragover="allowDrop(event)" ondrop="drop(event, 'todo')" ondragleave="dragLeave(event)">
      <div class="col-header">
        <div class="col-title">

      </div>
      <div class="task-list" id="list_progress"></div>
    </div>

    <!-- DONE -->
    <div class="kanban-col" id="col_done" ondragover="allowDrop(event)" ondrop="drop(event, 'done')" ondragleave="dragLeave(event)">
      <div class="col-header">
        <div class="col-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Done
        </div>
        <span class="col-count" id="count_done">0</span>
      </div>
      <div class="task-list" id="list_done"></div>
    </div>
  </div></div></main>

<!-- Add Task Modal -->
<div class="modal" id="taskModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Add New Task</div>
    </div>
    <div class="form-group">
      <label>Select Accepted Event</label>
      <select id="taskEventSelect"></select>
    </div>
    <div class="form-group">
      <label>Task Description</label>
      <input type="text" id="taskDescInput" placeholder="Enter task details...">
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="taskPriority">
        <option value="High">High</option>
        <option value="Medium" selected="">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="createTask()">Create Task</button>
    </div>
  </div>

<script src="../../scripts/vendor_js/data.js"></script>
<script>
const STORE_KEY = 'staffAssignments';

let MY_STAFF_ID = null;
let MY_NAME = 'Staff Member';
let MY_EMAIL = '';

function initIdentity() {
  if (typeof DB !== 'undefined') {
    const s = DB.getSession();
    MY_NAME = s.user || 'Staff Member';
    MY_EMAIL = (s.email || '').toLowerCase();
    
    // Try matching by name first, then by email
    const staffList = DB.getAll('staff');
    let me = staffList.find(st => st.name === MY_NAME);
    if (!me && MY_EMAIL) {
      me = staffList.find(st => (st.email || '').toLowerCase() === MY_EMAIL);
    }
    if (me) MY_STAFF_ID = me.id;
  }
}

function loadAssignments() {
  const all = (typeof DB !== 'undefined') ? (DB.getAll('staffAssignments') || []) : [];
  const safeName = (MY_NAME || '').trim().toLowerCase();
  return all.filter(a => {
    const isMe = (MY_STAFF_ID && a.staffId === MY_STAFF_ID) || (a.staffName && a.staffName.trim().toLowerCase() === safeName);
    return isMe && a.status === 'accepted';
  });
}

function saveAssignments(arr) {
  if (typeof DB !== 'undefined') {
    // Update each assignment individually via PATCH /staff-assignments/:id
    arr.forEach(a => {
      DB.update('staffAssignments', a.id, { tasks: a.tasks });
    });
  }
}

function renderBoard() {
  const accepted = loadAssignments();
  const lists = { todo: [], progress: [], done: [] };
  
  accepted.forEach(assignment => {
    // 1. Ensure the tasks array exists
    if (!assignment.tasks) assignment.tasks = [];
    
    // 2. If it's a legacy assignment with just taskDesc, migrate it to a real task object if not already done
    if (assignment.tasks.length === 0 && assignment.taskDesc) {
       assignment.tasks.push({
          id: assignment.id + '_base',
          desc: assignment.taskDesc,
          priority: assignment.priority || 'Medium',
          status: 'todo',
          eventName: assignment.eventName
       });
       // Save the migration immediately to persistence
       saveAssignments(accepted);
    }

    assignment.tasks.forEach(task => {
        if (lists[task.status]) lists[task.status].push({ ...task, assignmentId: assignment.id });
    });
  });

  ['todo', 'progress', 'done'].forEach(status => {
     const listEl = document.getElementById('list_' + status);
     const countEl = document.getElementById('count_status');
     document.getElementById('count_' + status).textContent = lists[status].length;
     
     listEl.innerHTML = lists[status].map(task => `
        <div class="task-card" draggable="true" ondragstart="dragStart(event, '${task.id}')" data-task-id="${task.id}" data-assignment-id="${task.assignmentId}">
          <div class="task-top">
            <div class="task-event">
               <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
               ${task.eventName}
            </div>
            <span class="priority-badge ${task.priority==='High'?'pri-high':task.priority==='Medium'?'pri-medium':'pri-low'}">${task.priority}</span>
          </div>
          <div class="task-name">${task.desc}</div>
          <div class="task-meta">
            <div class="task-meta-item">
               <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
               Today
            </div>
            <div class="task-meta-item" style="color:var(--pink); cursor:pointer" onclick="deleteTask('${task.assignmentId}', '${task.id}')">
               <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </div>
          </div>
        </div>
     `).join('');
  });

  // Task board rendered successfully
}

// Drag & Drop
function dragStart(e, id) {
  e.dataTransfer.setData('text/plain', id);
  e.currentTarget.style.opacity = '0.5';
}

function allowDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}

function dragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function drop(e, newStatus) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  
  const taskId = e.dataTransfer.getData('text/plain');
  if (!taskId) return;

  const assignments = loadAssignments();
  let changed = false;
  
  assignments.forEach(a => {
    const task = a.tasks.find(t => t.id === taskId);
    if (task && task.status !== newStatus) {
      const oldStatus = task.status;
      task.status = newStatus;
      changed = true;
      
      // Adjust workload when tasks move to/from done
      if (typeof DB !== 'undefined' && MY_STAFF_ID) {
        const me = DB.find('staff', MY_STAFF_ID);
        if (me) {
          let wl = me.workload || 0;
          if (newStatus === 'done' && oldStatus !== 'done') {
            wl = Math.max(wl - 20, 0);
            DB.update('staff', MY_STAFF_ID, { workload: wl });
          } else if (oldStatus === 'done' && newStatus !== 'done') {
            wl = Math.min(wl + 20, 100);
            DB.update('staff', MY_STAFF_ID, { workload: wl });
          }
        }
      }
    }
  });

  if (changed) {
    saveAssignments(assignments);
    renderBoard();
  }
}

// Modal logic
function openModal() {
  const accepted = loadAssignments();
  const select = document.getElementById('taskEventSelect');
  select.innerHTML = accepted.map(a => `<option value="${a.id}">${a.eventName}</option>`).join('');
  document.getElementById('taskDescInput').value = '';
  document.getElementById('taskModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('taskModal').style.display = 'none';
}

function createTask() {
  const assignmentId = document.getElementById('taskEventSelect').value;
  const desc = document.getElementById('taskDescInput').value.trim();
  const priority = document.getElementById('taskPriority').value;
  
  if (!desc) { alert('Enter task description'); return; }

  const assignments = loadAssignments();
  const a = assignments.find(item => item.id === assignmentId);
  if (a) {
    if (!a.tasks) a.tasks = [];
    a.tasks.push({
      id: 'T_' + Date.now(),
      desc,
      priority,
      status: 'todo',
      eventName: a.eventName
    });
    saveAssignments(assignments);
    renderBoard();
    closeModal();
  }
}

function deleteTask(aId, tId) {
  if (!confirm('Delete this task?')) return;
  const assignments = loadAssignments();
  const a = assignments.find(item => item.id === aId);
  if (a && a.tasks) {
    a.tasks = a.tasks.filter(t => t.id !== tId);
    saveAssignments(assignments);
    renderBoard();
  }
}

document.addEventListener('DOMContentLoaded', () => {
    initIdentity();
    renderBoard();
    setInterval(renderBoard, 5000);
});
</script>
